<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Address Book Buddies</title>
  <style>
    body { font-family: sans-serif; margin: 40px; }
    table { border-collapse: collapse; width: 50%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
  </style>
</head>
<body>

<h2 th:text="'Buddies for Address Book #' + ${addressBookId}">Address Book Buddies</h2>

<table th:if="${not #lists.isEmpty(buddies)}">
  <thead>
  <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Phone Number</th>
    <th>Location</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="buddy : ${buddies}">
    <td th:text="${buddy.id}">1</td>
    <td th:text="${buddy.firstName}">John Doe</td>
    <td th:text="${buddy.phoneNumber}">555-1234</td>
    <td th:text="${buddy.location}">New York</td>
  </tr>
  </tbody>
</table>

<!-- Fallback if the address book is empty -->
<p th:if="${#lists.isEmpty(buddies)}">No buddies found in this address book.</p>

<br>
<a href="/">Back to Address Books</a>

<form th:action="@{/AddressBook/{id}/add(id=${addressBookId})}" th:object="${newItem}" method="post">
  <input type="hidden" name="addressBookId" th:value="${addressBookId}"/>
  <label for="name">Item Name:</label>
  <input type="text" id="name" name="name" required/>
  <label for="phoneNumber">Phone Number:</label>
  <input type="text" id="phoneNumber" name="phoneNumber" required/>
  <label for="address">Address:</label>
  <input type="text" id="address" name="address" required/>
  <button type="submit">Add to Table</button>
</form>

</body>
</html>
