# App Name
spring.application.name=rest-h2-demo

server.port=${PORT:8080}
server.address=0.0.0.0

# H2 Database Setup
spring.datasource.url=https://workingsite-fjhzbwhkcbcabvhk.canadacentral-01.azurewebsites.net/
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable the web-based H2 console UI
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Settings (Auto-creates database tables matching your code)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect